<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweetness — Homemade Chocolates</title>
<meta name="description" content="Handmade chocolates from Malad East and IZYAN attar & perfumes. Order on WhatsApp.">
<link rel="canonical" href="https://sweetness-bytes.github.io/shop/">
<meta http-equiv="refresh" content="1; url=shop/">
<link rel="icon" type="image/png" href="shop/icons/favicon-32.png">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF1DE;color:#330715;font:16px/1.5 system-ui,sans-serif;text-align:center}a{color:#330715;font-weight:600}</style>
<script>
(function(){
  var go=function(){location.replace("shop/"+location.search+location.hash)};
  /* the website used to run from this address: remove its old offline helper first */
  try{
    if("serviceWorker" in navigator&&navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.filter(function(r){return r.scope===location.origin+"/"}).map(function(r){return r.unregister()}));
      }).then(go,go);
      setTimeout(go,800);return;
    }
  }catch(e){}
  go();
})();
</script>
</head>
<body>
<p>Opening Sweetness…<br><a href="shop/">Tap here if it does not open</a></p>
</body>
</html>
