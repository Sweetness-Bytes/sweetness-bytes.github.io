<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweetness Manager</title>
<meta name="description" content="Billing, stock, customers, marketing and reports for Sweetness homemade chocolates.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3a201e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SB Manager">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Sweetness Business Manager — chocolate brown + rose pink + gold, cream background */
:root{
  color-scheme:light;
  --pri:#4a2c2a; --pri-d:#3a201e; --pri-2:#6b3e3a;
  --acc:#e86a92; --acc-soft:#fbdde7; --gold:#c9a227; --gold-soft:#f6e8bd;
  --bg:#fff8f1; --card:#fffdfa; --chip:#f6ece2; --line:#eedfd2;
  --ink:#2b1a17; --muted:#8a756c;
  --ok:#2e7d4f; --ok-s:#e2f3e8; --bad:#b3261e; --bad-s:#fbe3e1; --warn:#b07a12; --warn-s:#fbefd3;
  --r:12px; --sh:0 4px 14px rgba(74,44,42,.08);
  --fd:'Playfair Display',Georgia,serif; --fb:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --top:56px; --nav:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb);padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
textarea{resize:vertical;min-height:70px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));background:var(--pri-d);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;min-width:0}
.brand img{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);background:#fff8e7}
.brand b{font-family:var(--fd);font-style:italic;font-size:20px;line-height:1}
.brand small{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#f3c9d7}
.pagechip{margin-left:auto;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.iconbtn{width:38px;height:38px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.eye.on{background:var(--gold);color:var(--pri-d)}

/* ---------- drawer ---------- */
.drawer{position:fixed;inset:0;z-index:50;display:flex}
.drawer .scrim{position:absolute;inset:0;background:rgba(30,15,12,.45)}
.drawer nav{position:relative;margin-left:auto;width:min(300px,86vw);height:100%;background:var(--card);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer h4{margin:12px 10px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drawer a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.drawer a:hover{background:var(--chip)}
.drawer a.on{background:var(--pri);color:#fff}
.drawer a i{font-style:normal;width:22px;text-align:center}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 -4px 14px rgba(74,44,42,.06)}
.bnav a,.bnav button{border:none;background:none;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:500;padding:6px 0}
.bnav a i,.bnav button i{font-style:normal;font-size:19px;line-height:1.1}
.bnav a.on{color:var(--pri)}
.bnav .plus{width:56px;height:56px;margin:-26px auto 0;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 16px rgba(232,106,146,.45);border:4px solid var(--bg)}

/* ---------- page ---------- */
main{max-width:1180px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right,0px)) 24px max(14px,env(safe-area-inset-left,0px))}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-family:var(--fd);font-size:24px;color:var(--pri)}
.ph .sp{flex:1}
.sub{color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:140px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;background:var(--pri);color:#fff;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--pri-2)}
.btn.acc{background:var(--acc)}.btn.acc:hover{background:#d65a82}
.btn.gold{background:var(--gold);color:var(--pri-d)}
.btn.wa{background:#1fa855}.btn.wa:hover{background:#178a45}
.btn.ghost{background:var(--card);color:var(--pri);border-color:var(--line)}
.btn.ghost:hover{background:var(--chip)}
.btn.danger{background:var(--card);color:var(--bad);border-color:var(--bad-s)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* pills */
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.p-paid,.p-ok,.p-billed{background:var(--ok-s);color:var(--ok)}
.p-due,.p-out,.p-cancelled{background:var(--bad-s);color:var(--bad)}
.p-partial,.p-low,.p-pending{background:var(--warn-s);color:var(--warn)}
.p-mto{background:var(--acc-soft);color:#b23a64}
.p-info{background:var(--chip);color:var(--muted)}

/* form */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span,.lbl{font-size:11.5px;color:var(--muted);font-weight:500}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.err{color:var(--bad);font-size:12px;min-height:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-weight:600;font-size:12.5px}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chip);padding:9px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:#fff4ec}

/* list items (phone friendly) */
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{color:var(--muted);font-size:11.5px}
.li .amt{font-weight:700;text-align:right;white-space:nowrap}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list .li.click{cursor:pointer}.list .li.click:hover{background:#fff4ec}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto;color:#fff}

/* dashboard */
.hello{font-family:var(--fd);font-size:24px;color:var(--pri)}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri-2));color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(232,106,146,.25)}
.hero small{font-size:12px;color:#f3c9d7;letter-spacing:.06em}
.hero .big{font-family:var(--fd);font-size:38px;line-height:1.1;margin:4px 0}
.hero .vs{font-size:12px;background:rgba(255,255,255,.14);display:inline-block;border-radius:999px;padding:3px 10px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.mini b{display:block;font-family:var(--fd);font-size:22px;color:var(--pri)}
.mini span{font-size:11.5px;color:var(--muted)}
.mini.alert b{color:var(--bad)}
button.mini{text-align:left}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink);padding:4px}
.qa button i{font-style:normal;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--acc-soft);box-shadow:inset 0 0 0 1px rgba(232,106,146,.25)}
.qa button:nth-child(2) i{background:var(--gold-soft)}.qa button:nth-child(3) i{background:var(--ok-s)}.qa button:nth-child(4) i{background:var(--chip)}
.secret .val{filter:blur(7px);user-select:none}
.secret .val.show{filter:none}
.st{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 8px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.pos>*{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.tile:hover{border-color:var(--acc)}
.tile .ic{position:relative;overflow:hidden;width:100%;aspect-ratio:16/10;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:7px 9px;color:#fff;isolation:isolate}
.tile .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.tile .ic::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(30,12,10,.75))}
.tile .ic em{font-style:normal;font-weight:700;font-size:14px;line-height:1.1;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.tile .ic small{font-size:10.5px;opacity:.9}
.tile .nm{font-weight:600;font-size:12.5px;line-height:1.25}
.tile .sz{font-size:11px;color:var(--muted)}
.tile .pr{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.tile .pr b{color:var(--pri)}
.tile .q{position:absolute;top:6px;right:6px;background:var(--acc);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:700;padding:0 6px}
.tile.no{opacity:.55}
.cart{position:sticky;top:calc(var(--top) + 14px)}
.cline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.cline .n{min-width:0}
.cline .n b{font-size:13px;font-weight:600;display:block}
.cline .n small{color:var(--muted);font-size:11px}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stp button{width:30px;height:30px;border:none;background:var(--chip);font-weight:700;color:var(--pri)}
.stp input{width:40px;border:none;border-radius:0;text-align:center;padding:4px;background:#fff}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin-top:8px}
.tot .g{font-family:var(--fd);font-size:24px;color:var(--pri);font-weight:700}
.cartbar{display:none}
@media (max-width:860px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .cart{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:45;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease}
  .cart.open{transform:none}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--pri);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;align-items:center;gap:10px;box-shadow:0 8px 22px rgba(0,0,0,.25);border:none;text-align:left}
  .cartbar b{font-size:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .scrim{position:absolute;inset:0;background:rgba(30,15,12,.5)}
.modal .box{position:relative;background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.modal .box.wide{max-width:860px}
@media (min-width:720px){.modal{align-items:center}.modal .box{border-radius:18px;padding:20px}}
.mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.mh h3{font-family:var(--fd);font-size:21px;color:var(--pri)}
.mh .x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);font-size:17px;flex:0 0 auto}
.mf{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}

/* invoice */
.inv{background:#fff;color:#222;border:1px solid var(--line);border-radius:10px;padding:18px;font-size:12.5px}
.inv .ih{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--pri);padding-bottom:10px;margin-bottom:10px}
.inv .ih img{width:54px;height:54px;border-radius:50%}
.inv .ih h1{font-family:var(--fd);font-style:italic;font-size:24px;color:var(--pri);line-height:1}
.inv .ih .meta{margin-left:auto;text-align:right;font-size:11.5px}
.inv table th{background:#f6ece2;color:#555}
.inv .it td,.inv .it th{padding:6px 8px}
.inv .bot{display:grid;grid-template-columns:1fr auto;gap:16px;margin-top:12px;align-items:start}
@media (max-width:560px){.inv .bot{grid-template-columns:1fr}.inv .bot>table{min-width:0!important;order:-1}.inv .ih .meta{font-size:10.5px}.inv{padding:12px}}
.inv .qr{text-align:center;font-size:11px}
.inv .qr svg{width:120px;height:120px}
.inv .ty{text-align:center;margin-top:12px;font-family:var(--fd);font-style:italic;color:var(--pri);font-size:15px}
@media print{
  body{background:#fff;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:0}
  #printArea .inv{border:none;padding:0}
  @page{margin:12mm}
}
#printArea{display:none}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--top) + 10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--pri-d);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center;border:1px solid var(--gold)}

/* reports */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi .mini b{font-size:20px}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;height:100%}
.bars .b i{display:block;width:100%;max-width:28px;background:linear-gradient(180deg,var(--acc),#c94f78);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b i.z{background:var(--line)}
.bars .b span{font-size:9.5px;color:var(--muted);white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:12.5px;margin-bottom:8px}
.hbar .tr{grid-column:1/-1;height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--pri-2);border-radius:99px}

/* marketing */
.msgprev{white-space:pre-wrap;background:#e7fbe0;border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:13px;border:1px solid #cbeec0}
.idea{border-left:4px solid var(--acc);padding:10px 12px;background:var(--card);border-radius:0 12px 12px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.idea b{display:block}
.idea p{margin:6px 0;white-space:pre-wrap;font-size:13px}

canvas.card-cv{width:100%;max-width:420px;height:auto;border-radius:14px;box-shadow:var(--sh);display:block;margin:0 auto}

.side{display:none}
@media (min-width:1000px){
  body{padding-bottom:0}
  .bnav,.cartbar{display:none!important}
  .shell{display:grid;grid-template-columns:230px minmax(0,1fr)}
  .side{display:block;position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top));overflow:auto;border-right:1px solid var(--line);background:var(--card);padding:10px 8px 20px}
  .side h4{margin:12px 10px 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500;font-size:13.5px}
  .side a:hover{background:var(--chip)}
  .side a.on{background:var(--pri);color:#fff}
  .side a i{font-style:normal;width:20px;text-align:center}
  .side .newbill{margin:4px 6px 8px;width:calc(100% - 12px)}
  #menuBtn{display:none}
  main{margin:0;max-width:1180px}
}

.sync{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.sync.s-synced{background:var(--ok-s);color:var(--ok);border-color:transparent}
.sync.s-syncing,.sync.s-pending{background:var(--warn-s);color:var(--warn);border-color:transparent}
.sync.s-error,.sync.s-offline{background:var(--bad-s);color:var(--bad);border-color:transparent}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,

/* ---------- money calc ---------- */
function statusOf(total,paid){var due=r2(total-paid);if(due<=0.004)return "PAID";if(paid>0.004)return "PARTIAL";return "DUE"}
function custLedger(c){
  var sales=S.sales.filter(function(s){return s.customerId===c.id});
  var bought=0,received=0,last="";
  sales.forEach(function(s){bought+=s.total;received+=s.paidAtBill;if(s.date>last)last=s.date});
  S.payments.forEach(function(p){if(p.party==="customer"&&p.partyId===c.id)received+=p.dir==="in"?p.amount:-p.amount});
  S.returns.forEach(function(rt){if(rt.customerId===c.id){bought-=rt.amount;received-=rt.refund||0}});
  return {bought:r2(bought),received:r2(received),outstanding:r2(bought-received),orders:sales.length,last:last};
}
function supLedger(s){
  var pur=0,paid=0;
  S.purchases.forEach(function(p){if(p.supplierId===s.id){pur+=p.total;paid+=p.paidAtBill}});
  S.payments.forEach(function(p){if(p.party==="supplier"&&p.partyId===s.id)paid+=p.dir==="out"?p.amount:-p.amount});
  return {purchases:r2(pur),paid:r2(paid),payable:r2(pur-paid)};
}
/* Apply a customer payment to their oldest unpaid bills */
function applyCustomerPayment(cid,amount){
  var left=amount;
  S.sales.filter(function(s){return s.customerId===cid&&s.due>0.004}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts}).forEach(function(s){
    if(left<=0)return;var take=Math.min(left,s.due);s.paid=r2(s.paid+take);s.due=r2(s.due-take);s.status=statusOf(s.total,s.paid);left=r2(left-take);
  });
  return left;
}
function applySupplierPayment(sid,amount){
  var left=amount;
  S.purchases.filter(function(p){return p.supplierId===sid&&p.due>0.004}).sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(p){
    if(left<=0)return;var take=Math.min(left,p.due);p.paid=r2(p.paid+take);p.due=r2(p.due-take);left=r2(left-take);
  });
  return left;
}

/* ---------- stock ---------- */
function logStock(pid,change,reason,ref){S.stockLog.unshift({id:uid("l"),date:todayStr(),ts:Date.now(),productId:pid,change:r2(change),reason:reason,ref:ref||""});if(S.stockLog.length>2000)S.stockLog.length=2000}
/* What a sale of qty units takes out of stock: the product itself (tracked) or its recipe (made to order) */
function saleNeeds(p,qty){
  var need={};
  if(!p)return need;
  if(p.track){need[p.id]=(need[p.id]||0)+qty}
  else (p.recipe||[]).forEach(function(r){need[r.id]=(need[r.id]||0)+r.qty*qty});
  return need;
}
function makeNeeds(p,qty){var need={};(p.recipe||[]).forEach(function(r){need[r.id]=(need[r.id]||0)+r.qty*qty});return need}
function shortages(need){
  var out=[];Object.keys(need).forEach(function(id){var p=prod(id);if(p&&p.track&&r2(p.stock-need[id])<-0.0001)out.push(pLabel(p)+": need "+qf(need[id])+" "+(p.unit||"")+", have "+qf(p.stock))});return out;
}
function applyNeeds(need,sign,reason,ref){Object.keys(need).forEach(function(id){var p=prod(id);if(p&&p.track){p.stock=r2(p.stock+sign*need[id]);logStock(id,sign*need[id],reason,ref)}})}
function unitCost(p){if(!p)return 0;if(p.cost>0)return p.cost;var c=0;(p.recipe||[]).forEach(function(r){var m=prod(r.id);if(m)c+=r.qty*(m.cost||0)});return r2(c)}

function addToCart(pid,qty){
  var p=prod(pid);if(!p)return;qty=qty||1;

  var l=CART.lines.filter(function(x){return x.productId===pid&&!x.free&&!x.note})[0];
  if(l)l.qty=r2(l.qty+qty);else CART.lines.push({key:uid("k"),productId:pid,name:p.name,size:p.size,qty:qty,rate:p.price,free:false,note:""});

function cartTotals(c){
  var sub=0;c.lines.forEach(function(l){if(!l.free)sub+=l.qty*l.rate});sub=r2(sub);
  var disc=c.discType==="pct"?r2(sub*(Number(c.disc)||0)/100):r2(Number(c.disc)||0);
  var cdisc=c.coupon?r2(sub*c.coupon.pct/100):0;
  var dTotal=Math.min(sub,r2(disc+cdisc));var after=r2(sub-dTotal);
  var tax=r2(after*(Number(c.gst)||0)/100);
  var del=c.delivery?(sub>=S.settings.freeAbove?0:r2(S.settings.deliveryFee)):0;
  var total=r2(after+tax+del);
  var paid=c.mode==="Credit"?0:(c.paid==null?Math.max(0,r2(total-(c.advance||0))):Math.min(r2(c.paid),total));
  return {sub:sub,disc:disc,cdisc:cdisc,dTotal:dTotal,after:after,tax:tax,del:del,total:total,paid:r2(paid),due:r2(total-paid)};
}

function bindCart(){
  var c=CART,el=$("#cart");
  $("#cClose").onclick=function(){el.classList.remove("open");if(window.innerWidth>860)go("home")};
  $("#cN").oninput=function(){c.name=this.value;var hit=S.customers.filter(function(x){return x.name===c.name})[0];if(hit&&!c.mobile){c.mobile=hit.mobile;$("#cM").value=hit.mobile;if(hit.address)c.address=hit.address}};
  $("#cM").oninput=function(){c.mobile=this.value;var cm=cleanMobile(this.value);if(cm.length===10){var hit=custByMobile(cm);if(hit&&!c.name){c.name=hit.name;$("#cN").value=hit.name;if(hit.address)c.address=hit.address}}};
  $("#lines").onclick=function(e){var row=e.target.closest(".cline");if(!row)return;var l=c.lines.filter(function(x){return x.key===row.dataset.k})[0];
    var d=e.target.closest("[data-d]");if(d){var nq=r2(l.qty+Number(d.dataset.d));if(nq<=0){c.lines.splice(c.lines.indexOf(l),1)}else{if(d.dataset.d>0&&l.productId){var p=prod(l.productId);if(p&&p.track&&p.stock<cartQty(p.id)+1){toast("Only "+qf(p.stock)+" in stock.");return}}l.qty=nq}drawTiles();drawCart();return}
    if(e.target.closest("[data-note]")){noteFor(l);return}
  };
  $("#lines").onchange=function(e){var row=e.target.closest(".cline");if(!row)return;var l=c.lines.filter(function(x){return x.key===row.dataset.k})[0];
    if(e.target.matches("[data-free]")){l.free=e.target.checked;drawCart()}
    if(e.target.matches("[data-q]")){var q=parseFloat(e.target.value);if(!(q>0)){c.lines.splice(c.lines.indexOf(l),1)}else{if(l.productId){var p=prod(l.productId);if(p&&p.track&&p.stock<cartQty(p.id)-l.qty+q){toast("Only "+qf(p.stock)+" in stock.");q=Math.max(1,p.stock-(cartQty(p.id)-l.qty))}}l.qty=r2(q)}drawTiles();drawCart()}
  };
  if(!c.lines.length)return;
  $("#cCA").onclick=function(){if(c.coupon){c.coupon=null;c.couponCode="";drawCart();return}
    var code=$("#cC").value.trim().toUpperCase();c.couponCode=code;var cp=findCoupon(code),cm=cleanMobile(c.mobile),cu=cm?custByMobile(cm):null,pr=couponProblem(cp,cu?cu.id:null);
    if(pr){$("#cCE").textContent=pr;return}c.coupon={code:cp.code,pct:cp.pct};drawCart()};
  $("#cD").onchange=function(){c.disc=Math.max(0,parseFloat(this.value)||0);c.paid=null;drawCart()};
  $("#cDT").onchange=function(){c.discType=this.value;c.paid=null;drawCart()};
  $("#cG").onchange=function(){c.gst=Number(this.value);c.paid=null;drawCart()};
  $("#cDel").onchange=function(){c.delivery=this.checked;c.paid=null;drawCart()};
  if($("#cA"))$("#cA").oninput=function(){c.address=this.value};
  $("#cMode").onclick=function(e){var b=e.target.closest("button");if(!b)return;c.mode=b.dataset.m;c.paid=null;drawCart()};
  if($("#cP"))$("#cP").onchange=function(){var v=parseFloat(this.value);c.paid=isNaN(v)?null:Math.max(0,v);drawCart()};
  $("#cSave").onclick=saveBill;
  $("#cClear").onclick=function(){newCart();drawTiles();drawCart()};
}
function noteFor(l){
  openModal("Note for "+l.name,'<label class="f"><span>e.g. message on bar, flavour, packing</span><input id="nIn" maxlength="60" value="'+esc(l.note)+'"></label><div class="mf"><button class="btn" id="nOk" type="button">Save note</button></div>',{mount:function(b){$("#nOk",b).onclick=function(){l.note=$("#nIn").value.trim();closeModal();drawCart()}}});

function saveBill(){
  var c=CART,err=$("#cErr");err.textContent="";
  if(!c.lines.length){err.textContent="Add at least one item.";return}
  var mob=cleanMobile(c.mobile);
  if(c.mobile.trim()&&!validMobile(mob)){err.textContent="Mobile number must be 10 digits (starting 6–9).";return}
  var t=cartTotals(c);
  if(t.due>0&&!mob&&!c.name.trim()){err.textContent="Balance due: enter customer name or mobile to keep udhaar.";return}
  if(c.delivery&&!c.address.trim()){err.textContent="Enter the delivery address.";return}
  // stock check incl. made-to-order recipes
  var need={};c.lines.forEach(function(l){if(!l.productId)return;var n=saleNeeds(prod(l.productId),l.qty);Object.keys(n).forEach(function(k){need[k]=(need[k]||0)+n[k]})});
  var sh=shortages(need);if(sh.length){err.innerHTML="Not enough stock:<br>"+sh.map(esc).join("<br>");return}
  var cust=upsertCustomer(c.name||(mob?"Customer":"Walk-in"),mob,c.address);
  var credit=cust?Math.max(0,-custLedger(cust).outstanding):0;
  if(c.coupon){var cp=findCoupon(c.coupon.code),pr=couponProblem(cp,cust?cust.id:null);if(pr){err.textContent=pr;c.coupon=null;drawCart();return}}
  S.seq.inv++;var inv=(S.settings.prefix||"SB")+"-"+String(S.seq.inv).padStart(4,"0");
  var items=c.lines.map(function(l){var p=l.productId?prod(l.productId):null;return {productId:l.productId,name:l.name,size:l.size,qty:l.qty,rate:l.free?0:l.rate,listRate:l.rate,free:l.free,note:l.note,cost:r2(unitCost(p)*l.qty)}});
  var cogs=r2(items.reduce(function(a,i){return a+i.cost},0));
  var sale={id:uid("s"),invoice:inv,date:c.date||todayStr(),ts:Date.now(),customerId:cust?cust.id:null,person:cust?cust.name:"Walk-in",mobile:mob,address:c.delivery?c.address.trim():(cust?cust.address:""),items:items,
    subtotal:t.sub,discount:t.disc,couponCode:c.coupon?c.coupon.code:"",couponDisc:t.cdisc,gstPct:Number(c.gst)||0,tax:t.tax,deliveryOn:c.delivery,delivery:t.del,total:t.total,paidAtBill:t.paid,paid:t.paid,due:t.due,status:statusOf(t.total,t.paid),payment:c.mode,cogs:cogs,profit:r2(t.after-cogs),bookOrderId:c.bookOrderId||null,loyaltyCode:""};
  if(credit>0&&sale.due>0){var take=Math.min(credit,sale.due);sale.paid=r2(sale.paid+take);sale.due=r2(sale.due-take);sale.status=statusOf(sale.total,sale.paid);sale.creditUsed=take}
  applyNeeds(need,-1,"Sold","inv "+inv);
  if(S.settings.cardPerBill){var tyc=S.products.filter(function(x){return x.name==="Thank-you cards"&&x.track})[0];if(tyc&&tyc.stock>=1){tyc.stock=r2(tyc.stock-1);logStock(tyc.id,-1,"Put in order","inv "+inv)}}
  if(c.coupon){var cp2=findCoupon(c.coupon.code);if(cp2){if(cp2.multi){cp2.uses=(cp2.uses||0)+1}else{cp2.used=true;cp2.usedOn=sale.date;cp2.usedInvoice=inv}}}
  if(S.settings.loyaltyOn&&cust&&cust.mobile){var code=newLoyaltyCode();S.coupons.push({code:code,customerId:cust.id,customer:cust.name,saleId:sale.id,issued:sale.date,validTill:addDays(sale.date,S.settings.loyaltyDays),pct:S.settings.loyaltyPct,used:false,multi:false,kind:"loyalty"});sale.loyaltyCode=code}
  if(c.bookOrderId){var o=S.orderBook.filter(function(x){return x.id===c.bookOrderId})[0];if(o){o.status="Billed";o.saleId=sale.id}}
  S.sales.push(sale);save();
  newCart();drawTiles();drawCart();$("#cart").classList.remove("open");
  afterSave(sale);
}

   '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px"><div><span style="color:#777">Bill to</span><br><b>'+esc(s.person)+'</b>'+(s.mobile?'<br>'+esc(s.mobile):'')+(s.address?'<br>'+esc(s.address):'')+'</div><div style="text-align:right"><span style="color:#777">Payment</span><br><b>'+esc(s.payment)+'</b><br><span class="pill p-'+s.status.toLowerCase()+'">'+s.status+'</span></div></div>'+
   '<table class="it"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>'+s.items.map(function(i){return '<tr><td>'+esc(i.name)+(i.size?'<br><small style="color:#777">'+esc(i.size)+'</small>':'')+(i.note?'<br><small style="color:#b23a64">“'+esc(i.note)+'”</small>':'')+(i.free?' <small>🎁 free</small>':'')+'</td><td class="r num">'+qf(i.qty)+'</td><td class="r num">'+inr(i.rate)+'</td><td class="r num">'+inr(i.rate*i.qty)+'</td></tr>'}).join("")+'</tbody></table>'+
   '<div class="bot"><div class="qr">'+(showQr?qrSvg(upiUrl(qrAmt,s.invoice))+'<div>Scan to pay <b>'+inr(qrAmt)+'</b><br>UPI: '+esc(st.upiId)+'</div>':'')+(st.bankAcc?'<div style="margin-top:6px;text-align:left">Bank: '+esc(st.bankName)+'<br>A/c '+esc(st.bankAcc)+' · IFSC '+esc(st.bankIfsc)+'</div>':'')+'</div>'+
   '<table class="num" style="min-width:220px"><tbody><tr><td>Subtotal</td><td class="r">'+inr(s.subtotal)+'</td></tr>'+(s.discount?'<tr><td>Discount</td><td class="r">−'+inr(s.discount)+'</td></tr>':'')+(s.couponDisc?'<tr><td>Coupon '+esc(s.couponCode)+'</td><td class="r">−'+inr(s.couponDisc)+'</td></tr>':'')+(s.tax?'<tr><td>GST '+s.gstPct+'% (CGST '+inr(s.tax/2)+' + SGST '+inr(s.tax/2)+')</td><td class="r">'+inr(s.tax)+'</td></tr>':'')+(s.deliveryOn?'<tr><td>Delivery</td><td class="r">'+(s.delivery?inr(s.delivery):"FREE")+'</td></tr>':'')+'<tr><td><b>Total</b></td><td class="r"><b style="font-size:15px">'+inr(s.total)+'</b></td></tr><tr><td>Paid</td><td class="r">'+inr(s.paid)+'</td></tr>'+(s.due>0?'<tr><td><b style="color:#b3261e">Balance due</b></td><td class="r"><b style="color:#b3261e">'+inr(s.due)+'</b></td></tr>':'')+'</tbody></table></div>'+
   (s.loyaltyCode?'<div style="margin-top:10px;border:1px dashed #e86a92;border-radius:8px;padding:8px;text-align:center">🎁 Your thank-you code <b>'+esc(s.loyaltyCode)+'</b> · '+S.settings.loyaltyPct+'% off your next order · valid till '+fdate(addDays(s.date,S.settings.loyaltyDays))+'</div>':'')+

function printInvoice(s){
  var pa=$("#printArea");pa.innerHTML=invoiceHTML(s);
  openModal(s.invoice,invoiceHTML(s)+'<div class="mf"><button class="btn ghost" type="button" id="iW">WhatsApp</button><button class="btn" type="button" id="iP">Print / Save PDF</button></div>',{wide:true,noFocus:true,mount:function(b){$("#iW",b).onclick=function(){waBill(s)};$("#iP",b).onclick=function(){window.print()}}});
}
function waBill(s){
  if(!s.mobile){toast("No mobile number on this bill.");}
  var st=S.settings,L=[greet(s.person),"","Thank you for your order from "+st.name+"! 🍫","","🧾 "+s.invoice+" · "+fdate(s.date)];
  s.items.forEach(function(i){L.push("• "+i.name+(i.size?" ("+i.size+")":"")+(i.note?" – “"+i.note+"”":"")+" × "+qf(i.qty)+" = "+(i.free?"FREE 🎁":inr(i.rate*i.qty)))});
  L.push("");if(s.discount||s.couponDisc)L.push("Discount: −"+inr(s.discount+s.couponDisc));if(s.tax)L.push("GST: "+inr(s.tax));if(s.deliveryOn)L.push("Delivery: "+(s.delivery?inr(s.delivery):"FREE"));
  L.push("*Total: "+inr(s.total)+"*");L.push("Paid: "+inr(s.paid)+(s.due>0?"  |  *Balance due: "+inr(s.due)+"*":"  ✅"));
  if(s.due>0&&st.upiId)L.push("","Pay by UPI: "+st.upiId);
  if(s.loyaltyCode)L.push("","🎁 Your thank-you code: *"+s.loyaltyCode+"*","Get "+st.loyaltyPct+"% off your next order (valid till "+fdate(addDays(s.date,st.loyaltyDays))+").");
  L.push("",shopSign());
  openWA(s.mobile,L.join("\n"));
}

PAGE.sales=function(m){
  VIEW.salesF=VIEW.salesF||"all";

   '<div class="stack"><div class="row"><input class="grow" id="sQ" type="search" placeholder="Search name, mobile, invoice" value="'+esc(VIEW.salesQ||"")+'"><div class="chips" id="sF">'+[["all","All"],["today","Today"],["week","7 days"],["month","This month"],["due","Due / partial"]].map(function(x){return '<button class="chip '+(VIEW.salesF===x[0]?"on":"")+'" data-f="'+x[0]+'" type="button">'+x[1]+'</button>'}).join("")+'</div></div><div id="sList"></div></div>';
  function draw(){var q=(VIEW.salesQ||"").toLowerCase(),f=VIEW.salesF,t=todayStr();
    var arr=S.sales.filter(function(s){if(f==="today"&&s.date!==t)return false;if(f==="week"&&s.date<addDays(t,-6))return false;if(f==="month"&&s.date.slice(0,7)!==t.slice(0,7))return false;if(f==="due"&&!(s.due>0))return false;return !q||(s.person+" "+s.mobile+" "+s.invoice).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return b.ts-a.ts});
    var tot=arr.reduce(function(a,s){return a+s.total},0),due=arr.reduce(function(a,s){return a+s.due},0);
    $("#sList").innerHTML='<p class="sub num">'+arr.length+' bills · '+inr(tot)+(due?' · due '+inr(due):'')+'</p>'+salesList(arr.slice(0,300),"No bills here","Bills you save from Quick Bill show up here.")}
  $("#sQ").oninput=function(){VIEW.salesQ=this.value;draw()};
  $("#sF").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;VIEW.salesF=b.dataset.f;$$(".chip",this).forEach(function(x){x.classList.toggle("on",x===b)});draw()};
  draw();

function viewSale(id){
  var s=saleById(id);if(!s)return;
  openModal(s.invoice,invoiceHTML(s)+'<div class="mf"><button class="btn danger" type="button" id="vD">Delete</button>'+(s.due>0&&s.customerId?'<button class="btn gold" type="button" id="vR">Receive payment</button>':'')+'<button class="btn ghost" type="button" id="vRt">Return items</button><button class="btn wa" type="button" id="vW">WhatsApp</button><button class="btn" type="button" id="vP">Print / PDF</button></div>',{wide:true,noFocus:true,mount:function(b){
    $("#vW",b).onclick=function(){waBill(s)};$("#vP",b).onclick=function(){printInvoice(s)};
    if($("#vR",b))$("#vR",b).onclick=function(){paymentForm({party:"customer",partyId:s.customerId,amount:s.due})};
    $("#vRt",b).onclick=function(){returnForm(s.id)};
    $("#vD",b).onclick=function(){confirmBox("Delete "+s.invoice+"?","Stock will be added back and the bill removed. Use this only for a wrong bill.","Delete bill",function(){deleteSale(s)},true)};
  }});
}
function deleteSale(s){
  if(S.returns.some(function(r){return r.saleId===s.id})){toast("This bill has returns. Delete the return first.");return}
  var need={};s.items.forEach(function(i){if(!i.productId)return;var n=saleNeeds(prod(i.productId),i.qty);Object.keys(n).forEach(function(k){need[k]=(need[k]||0)+n[k]})});
  applyNeeds(need,1,"Bill deleted",s.invoice);
  if(s.loyaltyCode)S.coupons=S.coupons.filter(function(c){return !(c.code===s.loyaltyCode&&!c.used)});
  if(s.couponCode){var cp=findCoupon(s.couponCode);if(cp){if(cp.multi)cp.uses=Math.max(0,(cp.uses||1)-1);else if(cp.usedInvoice===s.invoice){cp.used=false;cp.usedInvoice=""}}}
  // money received after the bill stays with the customer as advance (ledger recalculates)
  S.sales=S.sales.filter(function(x){return x.id!==s.id});
  S.orderBook.forEach(function(o){if(o.saleId===s.id){o.status="Pending";o.saleId=null}});
  save();toast("Deleted "+s.invoice);render();
}
function csvDownload(name,rows){
  var csv=rows.map(function(r){return r.map(function(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);
}
function exportSalesCSV(){
  var rows=[["Invoice","Date","Customer","Mobile","Items","Subtotal","Discount","Coupon","GST","Delivery","Total","Paid","Due","Status","Mode","Cost","Profit"]];
  S.sales.slice().sort(function(a,b){return a.ts-b.ts}).forEach(function(s){rows.push([s.invoice,s.date,s.person,s.mobile,s.items.map(function(i){return i.name+(i.size?" ("+i.size+")":"")+" x"+i.qty}).join("; "),s.subtotal,s.discount,s.couponDisc,s.tax,s.delivery,s.total,s.paid,s.due,s.status,s.payment,s.cogs,s.profit])});
  csvDownload("sweetness-sales-"+todayStr()+".csv",rows);
}

function returnForm(saleId){
  var s=saleById(saleId);if(!s)return;
  var already={};S.returns.filter(function(r){return r.saleId===s.id}).forEach(function(r){r.items.forEach(function(i){already[i.idx]=(already[i.idx]||0)+i.qty})});
  openModal("Return from "+s.invoice,'<p class="sub">'+esc(s.person)+' · '+fdate(s.date)+'</p><div class="list">'+s.items.map(function(i,ix){var left=r2(i.qty-(already[ix]||0));return '<div class="li"><div class="t"><b>'+esc(i.name)+'</b><small>'+esc(i.size||"")+' · '+inr(i.rate)+' · sold '+qf(i.qty)+(already[ix]?" · returned "+qf(already[ix]):"")+'</small></div><input type="number" min="0" max="'+left+'" step="any" data-ix="'+ix+'" value="0" style="width:80px" '+(left<=0?"disabled":"")+' aria-label="Return quantity"></div>'}).join("")+'</div>'+
   '<label class="chk" style="margin-top:10px"><input type="checkbox" id="rBack" checked> Put items back in stock (not for damaged items)</label><p class="num" id="rT"></p>'+
   '<div class="fg"><label class="f"><span>Give money back by</span><select id="rM"><option>Cash</option><option>UPI</option><option>Card</option></select></label></div><p class="sub" id="rH"></p><div class="err" id="rE"></div><div class="mf"><button class="btn" id="rOk" type="button">Save return</button></div>',{mount:function(b){

    function amount(){var a=0;$$("[data-ix]",b).forEach(function(x){var q=parseFloat(x.value)||0;a+=q*s.items[+x.dataset.ix].rate});return r2(a*ratio)}
    function upd(){var a=amount(),adj=Math.min(a,s.due),ref=r2(a-adj);$("#rT",b).innerHTML="Return value: <b>"+inr(a)+"</b>";$("#rH",b).textContent=a?(adj?inr(adj)+" reduces the unpaid balance. ":"")+(ref?inr(ref)+" to give back.":""):""}
    upd();b.addEventListener("input",upd);
    $("#rOk",b).onclick=function(){var E=$("#rE",b),its=[],bad="";$$("[data-ix]",b).forEach(function(x){var q=parseFloat(x.value)||0,ix=+x.dataset.ix,left=r2(s.items[ix].qty-(already[ix]||0));if(q<0||q>left)bad="Return qty can’t be more than sold.";if(q>0)its.push({idx:ix,productId:s.items[ix].productId,name:s.items[ix].name,qty:q,rate:s.items[ix].rate})});
      if(bad){E.textContent=bad;return}if(!its.length){E.textContent="Enter a quantity to return.";return}
      var a=amount(),adj=Math.min(a,s.due),ref=r2(a-adj);S.seq.ret++;
      var cogsBack=r2(its.reduce(function(t,i){var orig=s.items[i.idx];return t+(orig.qty?orig.cost*i.qty/orig.qty:0)},0));
      var rec={id:uid("r"),no:"RET-"+String(S.seq.ret).padStart(4,"0"),date:todayStr(),ts:Date.now(),saleId:s.id,invoice:s.invoice,customerId:s.customerId,person:s.person,items:its,amount:a,adjust:adj,refund:ref,mode:$("#rM",b).value,restock:$("#rBack",b).checked,cogsBack:cogsBack};
      if(adj){s.due=r2(s.due-adj);s.status=s.due>0?(s.paid>0?"PARTIAL":"DUE"):"PAID"}
      if(rec.restock){var need={};its.forEach(function(i){if(!i.productId)return;var n=saleNeeds(prod(i.productId),i.qty);Object.keys(n).forEach(function(k){need[k]=(need[k]||0)+n[k]})});applyNeeds(need,1,"Returned",rec.no)}
      S.returns.push(rec);save();closeModal();toast("Return saved"+(ref?": give back "+inr(ref):""));if(route==="returns")render();else go("returns")};

function moneyMoves(){
  /* every rupee in or out, by mode */
  var mv=[];

/* ================= Google Sheet sync =================
   Whole data set lives in the sheet; each phone keeps a copy.
   - Every record gets `upd` (last change time) automatically on save, deletions become tombstones.
   - Push sends `base` = sheet version we last saw. If someone else pushed since, the script refuses,
     we pull, merge record by record (newest change wins), and push again.
   - Stock is merged as movements: sheet stock + this phone's stock changes the sheet hasn't seen. */
var COLLS={sales:"id",purchases:"id",returns:"id",expenses:"id",payments:"id",customers:"id",suppliers:"id",coupons:"code",orderBook:"id",campaigns:"id",products:"id"};

function recSig(c,r){var o={};Object.keys(r).forEach(function(k){if(k!=="upd"&&!(c==="products"&&k==="stock"))o[k]=r[k]});return JSON.stringify(o)}
function snapAll(){SNAP={};Object.keys(COLLS).forEach(function(c){var k=COLLS[c];(S[c]||[]).forEach(function(r){SNAP[c+"|"+r[k]]=recSig(c,r)})})}
function markChanges(){
  var now=Date.now(),seen={};S.meta=S.meta||{};S.deleted=S.deleted||[];var changed=false;
  Object.keys(COLLS).forEach(function(c){var k=COLLS[c];(S[c]||[]).forEach(function(r){var key=c+"|"+r[k];seen[key]=1;var sig=recSig(c,r);if(SNAP[key]!==sig){r.upd=now;SNAP[key]=sig;changed=true}})});
  Object.keys(SNAP).forEach(function(key){if(!seen[key]){var p=key.split("|");S.deleted.push({c:p[0],id:p.slice(1).join("|"),ts:now});delete SNAP[key];changed=true}});
  if(S.deleted.length>3000)S.deleted=S.deleted.slice(-3000);
  return changed;
}
/* wrap the core save(): mark what changed, flag pending, schedule a push */
var _coreSave=save;
save=function(opt){
  opt=opt||{};S.meta=S.meta||{};
  if(!opt.system){markChanges();S.meta.fresh=false;S.meta.pending=true;S.meta.changedAt=Date.now()}
  var ok=_coreSave();
  if(ok&&!opt.system)schedulePush();
  return ok;
};
function cloudOn(){return !!(S.settings.cloudUrl&&S.settings.cloudKey)}
function setSync(state,msg){SYNC.state=state;SYNC.msg=msg||"";var el=$("#syncChip");if(el){el.className="sync s-"+state;el.textContent=syncLabel()}var st=$("#clSt");if(st)st.innerHTML="Status: <b>"+syncLabel()+"</b>"+(SYNC.last?" · last synced "+new Date(SYNC.last).toLocaleString("en-IN"):"")+(SYNC.msg?" · "+esc(SYNC.msg):"")}
function syncLabel(){if(!cloudOn())return "☁️ Cloud off";return {synced:"☁️ Synced",syncing:"☁️ Syncing…",pending:"☁️ Changes waiting",offline:"☁️ Offline",error:"☁️ Sync problem"}[SYNC.state]||"☁️ Cloud on"}
function schedulePush(){if(!cloudOn())return;setSync("pending");clearTimeout(SYNC.timer);SYNC.timer=setTimeout(function(){syncNow()},2500)}

function cloudGet(){var u=S.settings.cloudUrl+(S.settings.cloudUrl.indexOf("?")>=0?"&":"?")+"key="+encodeURIComponent(S.settings.cloudKey)+"&t="+Date.now();
  return fetch(u,{method:"GET",redirect:"follow"}).then(function(r){return r.json()})}
function cloudPost(body){body.key=S.settings.cloudKey;
  return fetch(S.settings.cloudUrl,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){return r.json()})}

/* ---------- merge ---------- */
function mergeStates(L,R){
  if(!R||!R.products)return L;
  var keepCloud={cloudUrl:L.settings.cloudUrl,cloudKey:L.settings.cloudKey};
  if(L.meta&&L.meta.fresh){var out=JSON.parse(JSON.stringify(R));Object.assign(out.settings,keepCloud);out.meta=Object.assign({},R.meta||{},{fresh:false});return out}
  var M=JSON.parse(JSON.stringify(R));
  var tomb={};(L.deleted||[]).concat(R.deleted||[]).forEach(function(d){tomb[d.c+"|"+d.id]=Math.max(tomb[d.c+"|"+d.id]||0,d.ts)});
  M.deleted=Object.keys(tomb).map(function(k){var p=k.split("|");return {c:p[0],id:p.slice(1).join("|"),ts:tomb[k]}}).slice(-3000);
  Object.keys(COLLS).forEach(function(c){var k=COLLS[c],map={},order=[];
    (R[c]||[]).forEach(function(r){map[r[k]]=r;order.push(r[k])});
    (L[c]||[]).forEach(function(r){var id=r[k],cur=map[id];
      if(!cur){map[id]=JSON.parse(JSON.stringify(r));order.push(id);return}
      if((r.upd||0)>(cur.upd||0)){var keepStock=c==="products"?cur.stock:undefined;map[id]=JSON.parse(JSON.stringify(r));if(c==="products")map[id].stock=keepStock}});
    M[c]=order.filter(function(id){var t=tomb[c+"|"+id];return !t||(map[id].upd||0)>t}).map(function(id){return map[id]});
  });
  /* stock: sheet stock + this phone's movements the sheet hasn't seen */
  var rlog={};(R.stockLog||[]).forEach(function(l){rlog[l.id]=1});
  var upTo=(L.meta&&L.meta.pushedUpTo)||0;
  var extra=(L.stockLog||[]).filter(function(l){return !rlog[l.id]&&l.ts>upTo});
  extra.forEach(function(l){var p=M.products.filter(function(x){return x.id===l.productId})[0];if(p&&p.track)p.stock=r2(p.stock+l.change)});
  M.stockLog=extra.concat(R.stockLog||[]).sort(function(a,b){return b.ts-a.ts}).slice(0,2000);
  /* customers created on two phones with the same mobile: keep one */
  var byMob={};M.customers.forEach(function(c){if(!c.mobile)return;if(!byMob[c.mobile])byMob[c.mobile]=c;else{var keep=byMob[c.mobile],drop=c;["sales","returns","orderBook","coupons"].forEach(function(col){(M[col]||[]).forEach(function(x){if(x.customerId===drop.id)x.customerId=keep.id})});(M.payments||[]).forEach(function(x){if(x.partyId===drop.id)x.partyId=keep.id});drop.__drop=1}});
  M.customers=M.customers.filter(function(c){return !c.__drop});
  M.seq={};["inv","pur","ord","ret"].forEach(function(k){M.seq[k]=Math.max((L.seq||{})[k]||0,(R.seq||{})[k]||0)});
  /* two phones billed offline and used the same invoice number: give this phone's new bill the next number */
  var rSale={},usedInv={};(R.sales||[]).forEach(function(s){rSale[s.id]=1;usedInv[s.invoice]=1});
  M.sales.slice().sort(function(x,y){return x.ts-y.ts}).forEach(function(s){if(rSale[s.id])return;
    if(usedInv[s.invoice]){M.seq.inv++;var n=s.invoice.replace(/-\d+$/,"")+"-"+String(M.seq.inv).padStart(4,"0");
      (M.returns||[]).forEach(function(r){if(r.saleId===s.id)r.invoice=n});(M.stockLog||[]).forEach(function(l){if(l.ref==="inv "+s.invoice&&l.ts>=s.ts-60000&&l.ts<=s.ts+60000)l.ref="inv "+n});
      s.invoice=n;s.upd=Date.now()}
    usedInv[s.invoice]=1});

  M.settings=Object.assign({},R.settings,L.settings,keepCloud);
  M.meta=Object.assign({},L.meta||{},{fresh:false});

}
function applyState(N,remoteStamp){
  var keep=S.meta||{};S=N;S.meta={fresh:false,syncedStamp:remoteStamp,pending:!!keep.pending,pushedUpTo:keep.pushedUpTo||0,lastSync:keep.lastSync||0,forcePush:!!keep.forcePush,changedAt:keep.changedAt||0};

/* ---------- sync ---------- */
function syncNow(manual){
  if(!cloudOn()){setSync("off");return Promise.resolve()}
  if(SYNC.busy){SYNC.again=true;return Promise.resolve()}
  if(!navigator.onLine){setSync("offline");return Promise.resolve()}
  SYNC.busy=true;setSync("syncing");
  var meta=S.meta=S.meta||{};
  return cloudGet().then(function(res){
    if(!res||!res.ok)throw new Error(res&&res.error||"bad_response");
    var rs=res.stamp||0,changed=false;
    if(res.data&&rs>(meta.syncedStamp||0)&&!meta.forcePush){
      var merged=meta.pending?mergeStates(S,res.data):(function(){var x=res.data;x.settings=Object.assign({},x.settings,{cloudUrl:S.settings.cloudUrl,cloudKey:S.settings.cloudKey});return x})();
      applyState(merged,rs);changed=true;
    }
    var got=importWebOrders(res.webOrders);if(got)changed=true;
    if(S.meta.pending||!res.data||S.meta.forcePush)return pushNow(rs).then(function(){return changed});
    return changed;
  }).then(function(changed){
    SYNC.busy=false;SYNC.last=Date.now();S.meta.lastSync=SYNC.last;_coreSave();setSync("synced");
    if(changed)safeRerender();
    if(manual)toast("Synced with Google Sheet ✓");
    if(SYNC.again){SYNC.again=false;syncNow()}
  }).catch(function(e){
    SYNC.busy=false;var m=String(e&&e.message||e);
    if(!navigator.onLine)setSync("offline");else setSync("error",m);
    if(manual)toast(m==="bad_key"?"Cloud key is wrong. Check Settings.":m==="run_setup"?"Run setup() in Apps Script first.":"Could not reach Google Sheet. Check the URL and internet.");
  });
}
function pushNow(base,tries){
  tries=tries||0;var stamp=Math.max(Date.now(),(base||0)+1),upTo=Date.now();
  var body={action:"push",stamp:stamp,base:S.meta.forcePush?undefined:(S.meta.syncedStamp||0),force:!!S.meta.forcePush,data:Object.assign({},S,{settings:Object.assign({},S.settings,{cloudUrl:"",cloudKey:""})}),views:sheetViews()};
  return cloudPost(body).then(function(res){
    if(res&&res.ok){S.meta.syncedStamp=res.stamp;S.meta.pushedUpTo=upTo;if(!(S.meta.changedAt>upTo))S.meta.pending=false;S.meta.forcePush=false;_coreSave();return}
