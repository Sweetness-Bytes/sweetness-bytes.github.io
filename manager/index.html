  el.innerHTML='<div class="stack"><div class="card"><div class="st">Create an offer code (many customers can use it)</div><div class="fg"><label class="f"><span>Code</span><input id="kC" maxlength="16" placeholder="DIWALI10" style="text-transform:uppercase"></label><label class="f"><span>% off</span><input id="kP" type="number" min="1" max="90" value="10"></label><label class="f"><span>Valid till</span><input id="kT" type="date" value="'+addDays(t,14)+'"></label><label class="f"><span>&nbsp;</span><button class="btn" id="kOk" type="button">Create code</button></label></div><div class="err" id="kE"></div></div>'+
   '<p class="sub">Loyalty codes are made automatically after every bill with a mobile number ('+S.settings.loyaltyPct+'% off, one-time, '+S.settings.loyaltyDays+' days). Change this in Settings.</p>'+
   (arr.length?'<div class="tw"><table><thead><tr><th>Code</th><th>Type</th><th>For</th><th class="r">%</th><th>Valid till</th><th>Status</th><th></th></tr></thead><tbody>'+arr.map(function(c,i){var exp=c.validTill&&c.validTill<t,st=c.multi?(exp?"EXPIRED":"ACTIVE · used "+(c.uses||0)):c.used?"USED "+esc(c.usedInvoice||""):exp?"EXPIRED":"ACTIVE";
     return '<tr><td><b>'+esc(c.code)+'</b></td><td><small>'+esc(c.multi?"Offer":c.kind||"Loyalty")+'</small></td><td><small>'+esc(c.customer||"Everyone")+'</small></td><td class="r num">'+c.pct+'</td><td><small>'+fdate(c.validTill)+'</small></td><td><span class="pill '+(st.indexOf("ACTIVE")===0?"p-ok":st.indexOf("USED")===0?"p-info":"p-due")+'">'+st+'</span></td><td>'+((c.multi&&!exp)||(!c.multi&&!c.used&&!exp)?'<button class="btn ghost sm" data-end="'+esc(c.code)+'" type="button">End</button>':'')+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="list"><div class="empty"><b>No codes yet</b></div></div>')+'</div>';
  $("#kOk").onclick=function(){var code=$("#kC").value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,""),p=parseFloat($("#kP").value),till=$("#kT").value;
    if(code.length<3){$("#kE").textContent="Code needs at least 3 letters/numbers.";return}if(findCoupon(code)){$("#kE").textContent="This code already exists.";return}if(!(p>0&&p<=90)){$("#kE").textContent="Enter % between 1 and 90.";return}if(!till||till<t){$("#kE").textContent="Choose a future date.";return}
    S.coupons.push({code:code,customer:"",issued:t,validTill:till,pct:p,multi:true,uses:0,kind:"offer"});save();toast("Code "+code+" created");mkCoupons(el)};
  el.onclick=function(e){var b=e.target.closest("[data-end]");if(!b)return;var c=findCoupon(b.dataset.end);c.validTill=addDays(t,-1);save();mkCoupons(el)};
}
function mkIdeas(el){
  var t=todayStr(),y=+t.slice(0,4),mobile=S.settings.mobile;
  function nextDate(md){var d=y+"-"+md;return d<t?(y+1)+"-"+md:d}
  var up=IDEAS.filter(function(i){return i.when!=="any"}).map(function(i){return Object.assign({d:nextDate(i.when)},i)}).sort(function(a,b){return a.d<b.d?-1:1});
  var any=IDEAS.filter(function(i){return i.when==="any"});
  el.innerHTML='<p class="sub">Captions for Instagram / WhatsApp Status. Festival dates move every year, so check the exact date. Use real photos of your own chocolates.</p><div class="stack">'+up.concat(any).map(function(i,ix){var cap=i.cap.replace(/\{mobile\}/g,mobile);var dd=i.d?dayDiff(t,i.d):null;
    return '<div class="idea"><div class="row"><b class="grow">'+esc(i.occ)+'</b>'+(i.d?'<span class="pill '+(dd<=14?"p-pending":"p-info")+'">'+(dd===0?"TODAY":"in "+dd+" days · "+fdate(i.d))+'</span>':'')+'</div><p>'+esc(cap)+'</p><button class="btn ghost sm" data-cp="'+ix+'" type="button">Copy caption</button></div>'}).join("")+'</div>';
  var all=up.concat(any);
  el.onclick=function(e){var b=e.target.closest("[data-cp]");if(!b)return;var txt=all[+b.dataset.cp].cap.replace(/\{mobile\}/g,mobile);
    var done=function(){b.textContent="Copied ✓"};try{navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt);done()})}catch(err){fallbackCopy(txt);done()}};
}
function fallbackCopy(t){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove()}
function mkOptOut(el){
  el.innerHTML='<div class="card stack"><p class="sub">Numbers here never appear in campaigns or follow-ups. Add anyone who asks you to stop messages.</p><div class="row"><input class="grow" id="ooM" inputmode="numeric" maxlength="14" placeholder="10-digit mobile"><button class="btn" id="ooA" type="button">Add</button></div><div class="err" id="ooE"></div>'+
   (S.optOut.length?'<div class="list">'+S.optOut.map(function(m,i){var c=custByMobile(m);return '<div class="li"><div class="t"><b>'+esc(m)+'</b><small>'+esc(c?c.name:"")+'</small></div><button class="btn ghost sm" data-rm="'+i+'" type="button">Remove</button></div>'}).join("")+'</div>':'<div class="empty">No one has opted out.</div>')+'</div>';
  $("#ooA").onclick=function(){var m=cleanMobile($("#ooM").value);if(!validMobile(m)){$("#ooE").textContent="Enter a valid 10-digit mobile.";return}if(S.optOut.indexOf(m)<0)S.optOut.push(m);save();mkOptOut(el)};
  el.onclick=function(e){var b=e.target.closest("[data-rm]");if(b){S.optOut.splice(+b.dataset.rm,1);save();mkOptOut(el)}};
}

/* ================= THANK YOU CARD ================= */
PAGE.card=function(m){
  var s=VIEW.cardSale?saleById(VIEW.cardSale):null;var C=VIEW.cardD=VIEW.cardD||{};
  if(s){C.name=s.person;C.code=s.loyaltyCode||"";C.mobile=s.mobile;VIEW.cardSale=null}
  var recent=S.sales.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,20);
  m.innerHTML='<div class="ph"><h2>Thank You Card</h2></div><div class="grid g2"><div class="card stack">'+
   '<label class="f"><span>Fill from a recent bill</span><select id="tS"><option value="">Choose bill…</option>'+recent.map(function(x){return '<option value="'+x.id+'">'+esc(x.invoice+" · "+x.person)+'</option>'}).join("")+'</select></label>'+
   '<label class="f"><span>Customer name</span><input id="tN" value="'+esc(C.name||"")+'" maxlength="30"></label><label class="f"><span>Code on card</span><input id="tC" value="'+esc(C.code||"")+'" maxlength="16"></label><label class="f"><span>Message</span><textarea id="tM" rows="3" maxlength="140">'+esc(C.msg||"Thank you for choosing us! Every piece was handmade with love, just for you.")+'</textarea></label>'+
   '<div class="lbl">Style</div><div class="seg" id="tSt">'+[["choc","Chocolate"],["rose","Rose"],["cream","Cream"]].map(function(x){return '<button type="button" data-s="'+x[0]+'" class="'+((C.style||"choc")===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>'+
   '<div class="row"><button class="btn" id="tD" type="button">Download image</button><button class="btn wa" id="tW" type="button">Share</button></div><p class="sub">Share sends the image where your phone supports it. Otherwise download it and attach in WhatsApp.</p></div>'+
   '<div><canvas class="card-cv" id="tCv" width="1080" height="1350" aria-label="Thank-you card preview"></canvas></div></div>';
  var logo=new Image();logo.src="icons/icon-512.png";logo.onload=draw;
  function draw(){var cv=$("#tCv");if(!cv)return;var x=cv.getContext("2d"),W=1080,H=1350,st=C.style||"choc";
    var P={choc:["#3a201e","#6b3e3a","#f6e8bd","#fff","#f3c9d7"],rose:["#b23a64","#e86a92","#fff1f5","#fff","#ffe3ec"],cream:["#fff8f1","#f6ece2","#4a2c2a","#4a2c2a","#b23a64"]}[st];
    var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,P[0]);g.addColorStop(1,P[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
    x.strokeStyle=st==="cream"?"#c9a227":"rgba(246,232,189,.7)";x.lineWidth=4;x.setLineDash([14,10]);x.strokeRect(50,50,W-100,H-100);x.setLineDash([]);
    x.fillStyle="rgba(255,255,255,.07)";x.beginPath();x.arc(W-120,170,220,0,7);x.fill();x.beginPath();x.arc(120,H-160,180,0,7);x.fill();
    x.save();x.beginPath();x.arc(W/2,250,120,0,7);x.closePath();x.fillStyle="#fff8e7";x.fill();x.clip();if(logo.complete&&logo.naturalWidth)x.drawImage(logo,W/2-120,130,240,240);x.restore();
    x.strokeStyle="#c9a227";x.lineWidth=6;x.beginPath();x.arc(W/2,250,123,0,7);x.stroke();
    x.textAlign="center";x.fillStyle=P[2];x.font="italic 600 64px 'Playfair Display', Georgia, serif";x.fillText(S.settings.name,W/2,450);
    x.font="500 26px Poppins, sans-serif";x.fillStyle=P[4];x.fillText((S.settings.tagline||"").toUpperCase().split("").join(" "),W/2,495);
    x.fillStyle=P[3];x.font="italic 600 92px 'Playfair Display', Georgia, serif";x.fillText("Thank you",W/2,640);
    var nm=$("#tN").value.trim();x.font="600 60px 'Playfair Display', Georgia, serif";x.fillStyle=P[2];if(nm)x.fillText(nm+"!",W/2,730);
    x.font="400 34px Poppins, sans-serif";x.fillStyle=P[3];wrap(x,$("#tM").value.trim(),W/2,820,820,50);
    var code=$("#tC").value.trim().toUpperCase();
    if(code){x.fillStyle=st==="cream"?"#4a2c2a":"#f6e8bd";rr(x,W/2-330,1010,660,170,30);x.fill();x.fillStyle=st==="cream"?"#fff":"#3a201e";x.font="500 28px Poppins, sans-serif";x.fillText("YOUR CODE FOR "+S.settings.loyaltyPct+"% OFF NEXT TIME",W/2,1065);x.font="700 70px Poppins, sans-serif";x.fillText(code,W/2,1145)}
    x.fillStyle=P[3];x.font="400 28px Poppins, sans-serif";x.fillText("📞 "+S.settings.mobile+(S.settings.website?"   ·   "+S.settings.website:""),W/2,1255)}
  function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
  function wrap(x,t,cx,y,mw,lh){var w=t.split(/\s+/),line="",n=0;for(var i=0;i<w.length;i++){var tt=line?line+" "+w[i]:w[i];if(x.measureText(tt).width>mw&&line){x.fillText(line,cx,y+n*lh);line=w[i];n++}else line=tt}if(line)x.fillText(line,cx,y+n*lh)}
  ["tN","tC","tM"].forEach(function(id){$("#"+id).oninput=function(){C.name=$("#tN").value;C.code=$("#tC").value;C.msg=$("#tM").value;draw()}});
  $("#tS").onchange=function(){var x=saleById(this.value);if(!x)return;C.name=x.person;C.code=x.loyaltyCode||"";C.mobile=x.mobile;$("#tN").value=C.name;$("#tC").value=C.code;draw()};
  $("#tSt").onclick=function(e){var b=e.target.closest("button");if(!b)return;C.style=b.dataset.s;$$("button",this).forEach(function(y){y.classList.toggle("on",y===b)});draw()};
  function blob(cb){$("#tCv").toBlob(cb,"image/png")}
  $("#tD").onclick=function(){blob(function(bl){var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="thank-you-"+($("#tN").value.trim().replace(/\W+/g,"-")||"card")+".png";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600)})};
  $("#tW").onclick=function(){blob(function(bl){var f=new File([bl],"thank-you.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:greet($("#tN").value)+" "+"thank you for your order! 🍫"}).catch(function(){})}else{$("#tD").click();toast("Image downloaded. Attach it in WhatsApp.")}})};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);draw();
};

/* ================= SETTINGS ================= */
PAGE.settings=function(m){
  var s=S.settings;
  function f(id,label,val,type,extra){return '<label class="f"><span>'+label+'</span><input id="s_'+id+'" '+(type?'type="'+type+'"':'')+' value="'+esc(val)+'" '+(extra||"")+'></label>'}
  m.innerHTML='<div class="ph"><h2>Settings &amp; Backup</h2></div><div class="stack">'+
   '<div class="card"><div class="st">Business</div><div class="fg">'+f("name","Business name",s.name)+f("tagline","Tagline",s.tagline)+f("owner","Owner name (for greeting)",s.owner)+f("mobile","Mobile",s.mobile,"","inputmode=numeric maxlength=14")+f("email","Email",s.email,"email")+f("website","Website",s.website)+f("gst","GSTIN (optional)",s.gst)+'</div>'+f("address","Address",s.address)+'</div>'+
   '<div class="card"><div class="st">Payments on bill</div><div class="fg">'+f("upiId","UPI ID",s.upiId)+f("upiName","Name on UPI",s.upiName)+f("bankName","Bank name",s.bankName)+f("bankAcc","Account no.",s.bankAcc)+f("bankIfsc","IFSC",s.bankIfsc)+'</div>'+
   '<div class="fg" style="margin-top:10px"><label class="chk"><input type="checkbox" id="s_qrOn" '+(s.qrOn?"checked":"")+'> Show UPI QR on bill</label><label class="f"><span>QR amount</span><select id="s_qrFor"><option value="due" '+(s.qrFor==="due"?"selected":"")+'>Balance due</option><option value="total" '+(s.qrFor==="total"?"selected":"")+'>Full bill</option></select></label></div></div>'+
   '<div class="card"><div class="st">Billing</div><div class="fg">'+f("prefix","Invoice prefix",s.prefix,"","maxlength=6")+f("gstDefault","Default GST %",s.gstDefault,"number","min=0 max=28")+f("deliveryFee","Delivery charge (₹)",s.deliveryFee,"number","min=0")+f("freeAbove","Free delivery from (₹)",s.freeAbove,"number","min=0")+'</div>'+f("thanks","Thank-you line on bill",s.thanks)+'</div>'+
   '<div class="card"><div class="st">Messages & loyalty</div><div class="fg"><label class="f"><span>WhatsApp greeting</span><select id="s_greet"><option value="en" '+(s.greet==="en"?"selected":"")+'>English: “Hello Priya,”</option><option value="mr" '+(s.greet==="mr"?"selected":"")+'>मराठी: “नमस्कार Priya,”</option></select></label><label class="chk"><input type="checkbox" id="s_loyaltyOn" '+(s.loyaltyOn?"checked":"")+'> Give a thank-you code after every bill</label><label class="chk"><input type="checkbox" id="s_cardPerBill" '+(s.cardPerBill?"checked":"")+'> Use 1 printed thank-you card from stock per bill</label>'+f("loyaltyPct","Code discount %",s.loyaltyPct,"number","min=1 max=50")+f("loyaltyDays","Code valid for (days)",s.loyaltyDays,"number","min=1 max=365")+'</div><p class="sub">Marathi greeting also switches the campaign templates to Marathi.</p></div>'+
   '<div class="err" id="sE"></div><button class="btn acc" id="sSave" type="button">Save settings</button>'+
   '<div class="card"><div class="st">☁️ Google Sheet sync</div><p class="sub">Paste the Web app URL and key from your Apps Script (see the setup guide). Then every bill, stock change and customer is saved to your Google Sheet, and every phone with the same URL sees the same data.</p><div class="fg" style="grid-template-columns:1fr">'+f("cloudUrl","Web app URL",s.cloudUrl,"url",'placeholder="https://script.google.com/macros/s/…/exec"')+f("cloudKey","Key",s.cloudKey,"",'autocomplete="off"')+'</div><p class="sub" id="clSt">Status: <b>'+syncLabel()+'</b>'+(SYNC.last?' · last synced '+new Date(SYNC.last).toLocaleString("en-IN"):'')+(SYNC.msg?' · '+esc(SYNC.msg):'')+'</p><div class="row"><button class="btn" id="clSave" type="button">Save & connect</button><button class="btn ghost" id="clNow" type="button">Sync now</button><button class="btn ghost" id="clOff" type="button">Turn off</button></div><div class="err" id="clE"></div><p class="sub" style="margin-top:12px">🌐 <b>Website orders</b> come into the Order Book on every sync (every 3 minutes while the app is open) and are also emailed to you. Turn on phone alerts to get a pop-up while the app is open.</p><button class="btn ghost" id="clNt" type="button">'+(("Notification" in window)&&Notification.permission==="granted"?"🔔 Phone alerts are on":"🔔 Turn on phone alerts")+'</button></div>'+
   '<div class="card"><div class="st">Backup & restore</div><p class="sub">'+(cloudOn()?"Your data is also saved in your Google Sheet. A backup file is still a good extra copy once a month.":"All data lives only on this phone. Download a backup every week and keep it on Google Drive or WhatsApp.")+' Last backup: <b>'+(s.lastBackup?fdate(s.lastBackup):"never")+'</b></p><div class="row"><button class="btn" id="bD" type="button">⬇ Download backup</button><label class="btn ghost" for="bF" style="cursor:pointer">⬆ Restore from file</label><input id="bF" type="file" accept=".json,application/json" hidden></div><div class="err" id="bE"></div></div>'+
   '<div class="card"><div class="st">Danger zone</div><p class="sub">Clears bills, customers, stock and settings on this phone. Download a backup first.</p><button class="btn danger" id="bR" type="button">Reset all data</button></div>'+
   '<p class="sub">Sweetness Business Manager · works offline · data stays on this device.</p></div>';
  $("#sSave").onclick=function(){var E=$("#sE");E.textContent="";var mob=cleanMobile($("#s_mobile").value);if(mob&&!validMobile(mob)){E.textContent="Mobile must be 10 digits.";return}
    ["name","tagline","owner","email","website","gst","address","upiId","upiName","bankName","bankAcc","bankIfsc","thanks"].forEach(function(k){s[k]=$("#s_"+k).value.trim()});
    s.mobile=mob;s.prefix=($("#s_prefix").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"")||"SB");
    ["gstDefault","deliveryFee","freeAbove","loyaltyPct","loyaltyDays"].forEach(function(k){var v=parseFloat($("#s_"+k).value);if(!isNaN(v)&&v>=0)s[k]=v});
    s.qrOn=$("#s_qrOn").checked;s.cardPerBill=$("#s_cardPerBill").checked;s.qrFor=$("#s_qrFor").value;s.greet=$("#s_greet").value;s.loyaltyOn=$("#s_loyaltyOn").checked;
    save();$(".brand b").textContent=s.name;toast("Settings saved")};
  $("#clSave").onclick=function(){var E=$("#clE");E.textContent="";var u=$("#s_cloudUrl").value.trim(),k=$("#s_cloudKey").value.trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)){E.textContent="URL should look like https://script.google.com/macros/s/…/exec";return}if(k.length<8){E.textContent="Paste the key shown by setup() in Apps Script.";return}
    S.settings.cloudUrl=u;S.settings.cloudKey=k;_coreSave();E.textContent="Connecting…";
    cloudGet().then(function(r){if(!r.ok)throw new Error(r.error);E.textContent="";S.meta.pending=true;_coreSave();if(!SYNC.started){SYNC.started=true;startSync()}return syncNow(true)}).then(function(){render()}).catch(function(e){var m=String(e&&e.message||e);E.textContent=m==="bad_key"?"Key does not match. Copy it again from Apps Script (setup log).":m==="run_setup"?"Run the setup function once in Apps Script, then try again.":"Could not connect. Check the URL, that the script is deployed with access “Anyone”, and internet."})};
  $("#clNow").onclick=function(){if(!cloudOn()){$("#clE").textContent="Save the URL and key first.";return}syncNow(true).then(function(){render()})};
  $("#clNt").onclick=function(){var me=this;if(!("Notification" in window)){toast("This browser does not support alerts. Email alerts still work.");return}
    Notification.requestPermission().then(function(r){if(r==="granted"){me.textContent="🔔 Phone alerts are on";notifyOrders("🔔 Alerts are on",{name:"New website orders will pop up like this",total:0})}else toast("Alerts blocked. Allow notifications for this site in browser settings.")})};
  $("#clOff").onclick=function(){S.settings.cloudUrl="";S.settings.cloudKey="";_coreSave();setSync("off");toast("Cloud sync turned off on this phone");render()};
  $("#bD").onclick=function(){S.settings.lastBackup=todayStr();save();var txt=JSON.stringify({app:"sweetness-manager",v:1,savedAt:new Date().toISOString(),data:S});var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download="sweetness-backup-"+todayStr()+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);toast("Backup downloaded");render()};
  $("#bF").onchange=function(){var file=this.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(o.app!=="sweetness-manager"||!o.data||!o.data.products)throw 0;
      confirmBox("Restore backup?","This replaces everything on this phone with the backup from "+(o.savedAt?new Date(o.savedAt).toLocaleString("en-IN"):"the file")+".","Restore",function(){var cu=S.settings.cloudUrl,ck=S.settings.cloudKey;S=o.data;S.settings.cloudUrl=S.settings.cloudUrl||cu;S.settings.cloudKey=S.settings.cloudKey||ck;S.meta=Object.assign({},S.meta||{},{fresh:false,forcePush:true});if(!save()){toast("Could not restore: phone storage is full.");return}load();snapAll();toast("Backup restored ✓");go("home");if(cloudOn())syncNow()},true)}catch(e){$("#bE").textContent="This is not a Sweetness Manager backup file."}};rd.readAsText(file);this.value=""};
  $("#bR").onclick=function(){confirmBox("Reset all data?","Everything on this phone will be deleted: bills, customers, stock and settings.","Yes, reset",function(){S=defaultState();save();toast("Reset done");go("home")},true)};
};
